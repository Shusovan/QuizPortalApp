spring.application.name=adminservice

server.port = 8084

security.service.url = http://localhost:8083/security-service

spring.datasource.url=jdbc:postgresql://localhost:5432/admin_db
spring.datasource.username = postgres
spring.datasource.password = Alliance123

# Hibernate Configuration
spring.jpa.database-platform = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql = true
spring.jpa.hibernate.ddl-auto = create-drop

# Logging Configuration (optional but can be useful for debugging)
logging.level.org.springframework.web = DEBUG
logging.level.org.hibernate = DEBUG
