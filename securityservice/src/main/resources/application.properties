spring.application.name=securityservice

server.port = 8083

# admin.service.url = "http://localhost:8084"
admin.service.url=http://localhost:8084

spring.datasource.url=jdbc:postgresql://localhost:5432/security_db
spring.datasource.username = postgres
spring.datasource.password = Alliance123

# Hibernate Configuration
spring.jpa.database-platform = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql = true
spring.jpa.hibernate.ddl-auto = update

# Logging Configuration (optional but can be useful for debugging)
logging.level.org.springframework.web = DEBUG
logging.level.org.hibernate = DEBUG